<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fresh fruits, vegetables and microgreens, delivered from the field."
    />
    <!-- Matches cream.50 in the Vayal Tailwind preset — the storefront
         header — so mobile browser chrome blends into it. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fffcf7" />

    <!-- Fraunces for headings, Inter for everything else (the preset's
         font-sans already names Inter; until now nothing loaded it). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph: what a shared link looks like in WhatsApp, which is how
         most of our customers will pass the store around. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vayalavan" />
    <meta property="og:title" content="Vayalavan" />
    <meta property="og:description" content="Fresh fruits, vegetables and microgreens, delivered from the field." />
    <meta property="og:image" content="/vayal-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Vayalavan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
