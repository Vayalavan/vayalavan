<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    Vayalavan favicon.

    A standalone copy of the mark with literal colours, because a favicon is
    loaded by the browser outside React and cannot inherit Tailwind theme
    classes. The values here must stay in sync with the `field` and `earth`
    ramps in tailwind-preset.js: primary-600 (#2b6446) and secondary-500
    (#ab7749).

    No background plate: the sprout reads on both light and dark browser
    chrome, and a coloured tile would fight the surrounding tab strip.
  -->
  <g fill="none" stroke="#ab7749" stroke-width="2.75" stroke-linecap="round">
    <path d="M4.5 36.5c6-3.2 12.2-4.8 19.5-4.8s13.5 1.6 19.5 4.8" />
    <path d="M8 43c4.8-2.6 9.8-3.9 16-3.9s11.2 1.3 16 3.9" />
  </g>
  <g fill="#2b6446">
    <path d="M24 32.5V16" fill="none" stroke="#2b6446" stroke-width="2.75" stroke-linecap="round" />
    <path d="M24.6 23.2c0-6.9 5.6-12.5 13.4-12.5 0 6.9-5.6 12.5-13.4 12.5Z" />
    <path d="M23.4 28.4c0-5.4-4.4-9.8-10.5-9.8 0 5.4 4.4 9.8 10.5 9.8Z" />
  </g>
</svg>
