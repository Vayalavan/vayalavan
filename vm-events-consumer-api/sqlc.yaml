version: "2"
sql:
  - engine: postgresql
    # Schema is read from the migrations themselves, so the generated code can
    # never drift from what the database actually looks like.
    schema: "migrations"
    queries: "internal/store/queries.sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        # Nullable columns become *T rather than pgtype wrappers — far less
        # ceremony at every call site.
        emit_pointers_for_null_types: true
        overrides:
          # google/uuid rather than pgtype.UUID: it is the type the rest of
          # the codebase and the JSON layer already speak.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # A business day is a time.Time in IST, handled by internal/isttime.
          # Left as pgtype.Date it would need unwrapping at every call site,
          # and the zero value would silently mean 0001-01-01 rather than
          # "unset".
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
