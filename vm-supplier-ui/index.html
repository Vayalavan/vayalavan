<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Supplier portal for Vayalavan — list produce and declare daily availability."
    />
    <!-- Matches surface.DEFAULT in the Vayal Tailwind preset, so mobile
         browser chrome blends with the page instead of flashing white. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf9f6" />

    <!-- Open Graph: what a shared link looks like in WhatsApp, which is how
         most of our customers will pass the store around. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vayalavan" />
    <meta property="og:title" content="Vayalavan Supplier" />
    <meta property="og:description" content="Supplier portal for Vayalavan." />
    <meta property="og:image" content="/vayal-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Vayalavan Supplier</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
