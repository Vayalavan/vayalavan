[project]
name = "vm-analytics-api"
version = "0.1.0"
description = "Read-only reports over the Vayalavan analytics schema (CLAUDE.md §5.4)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    # zoneinfo's data on images without the OS tz database: IST must not
    # depend on the host (CLAUDE.md rule 2).
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
# An application, not a library: nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
