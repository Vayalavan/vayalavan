# Serving vm-analytics-ui, a Module Federation remote.
#
# Differs from ui.conf in two ways, both because its files are loaded by a
# page on ANOTHER origin (the admin console):
#
#   - CORS. A cross-origin module script or dynamic import() needs
#     Access-Control-Allow-Origin. "*" is safe here: these are public static
#     files fetched without credentials, and the bundle holds nothing secret
#     (every VITE_ value is public by definition).
#   - remoteEntry.js is the remote's index.html: an unhashed name that points
#     at the hashed chunks. Cached, it would pin the console to a previous
#     deploy's chunks, which may no longer exist.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The standalone harness. Admins use Analytics inside the console.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
