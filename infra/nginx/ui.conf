# Serving a Vite single-page app.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints asset filenames, so a changed file is a changed URL and
    # these can be cached indefinitely. index.html must NOT be — it is the file
    # that points at the new fingerprints, and a cached copy pins a browser to
    # the previous deploy's assets, which may no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /orders/abc is a React route, not a file. Everything
    # unmatched falls back to index.html so a deep link or a refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # These are also set by the gateway for API responses; repeated here
    # because static files are served by nginx and never pass through it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's default is 512, and the images bundled with the UI exceed it.
    client_max_body_size 2m;
}
